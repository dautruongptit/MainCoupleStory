server {
    listen 8111;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Router tự viết (src/app/router) điều hướng phía client -> mọi path
    # không khớp file tĩnh đều trả index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File build (hash trong tên) cache lâu dài.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api/qr-png: chỉ là middleware giả lập của Vite dev server (vite.config.ts),
    # KHÔNG tồn tại trong bản build tĩnh. Production cần trỏ sang backend thật
    # (sinh QR VietQR từ tham số ?d=) — ví dụ bật đoạn proxy dưới đây khi có domain/service name:
    # location /api/ {
    #     proxy_pass http://<ten-service-api>:<port>/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
