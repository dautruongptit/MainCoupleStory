server {
    listen 8111;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Router tự viết (src/app/router) điều hướng phía client -> mọi path
    # không khớp file tĩnh đều trả index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File build (hash trong tên) cache lâu dài.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api/qr-png (dùng ở 116 chỗ trong src/, vd Gifts.tsx): chỉ là middleware giả lập
    # của Vite dev server (vite.config.ts) — KHÔNG có trong bản build tĩnh, VÀ backend
    # Java (../api) CHƯA có endpoint sinh QR nào cả (đã kiểm: không có controller/route
    # nào khớp "qr"). Bật proxy dưới đây CHƯA đủ — phải viết endpoint sinh ảnh QR VietQR
    # từ tham số ?d= trong backend trước (api service tên "mainCouple-api", cổng 8112,
    # cùng mạng mainCouple-net), rồi đổi "/api/qr-png" bên proxy cho khớp path thật của
    # route đó (backend hiện dùng tiền tố /api/v1/..., không phải /api/qr-png).
    # location /api/ {
    #     proxy_pass http://mainCouple-api:8112/api/v1/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
